name: CI

# A push to main, and a pull request, each run once. `push` used to have no branch filter, so every
# push to a PR branch ran twice: once as the branch and once as the PR's merge result. The
# concurrency group below could not fold them, because the two have different refs. A branch with
# no PR runs by hand: gh workflow run CI --ref <branch>.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Two jobs rather than one matrix with conditionals. The two platforms share the
# build and the gate and agree about nothing else: one installs prerequisites with
# brew and the other with an SDK installer, one has a front door that exists to work
# around dyld and the other has one that does not need to. A matrix would express
# that as `if:` on most steps, which is a matrix in name and a fork in fact.
#
# Linux is deliberately absent for now. The Windows job establishes one additional
# source-build and launcher contract; neither that nor the macOS headless gate is
# evidence for a Linux path that has not been exercised.
jobs:
  verify:
    name: Build and root gate (macOS)
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out Blix
        uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Install the supported macOS prerequisites
        run: brew install molten-vk vulkan-loader vulkan-headers vulkan-tools vulkan-validationlayers shaderc spirv-cross openal-soft

      # The glTF conformance corpus is a pinned manifest rather than committed bytes
      # (conventions §7, and three upstream licences). Nothing fetched it in CI, so the
      # eight conformance checks in Blix.Test.Recipes announced themselves as skipped on
      # every run and only ever ran where somebody had fetched by hand -- an instrument
      # that exists and is not used, which is how Blix.Test.Studio once went red unnoticed.
      # Cached on the manifest's hash, so it is one download per change to the manifest.
      - name: Cache the glTF conformance corpus
        uses: actions/cache@v4
        with:
          path: third_party/gltf-corpus
          key: gltf-corpus-${{ hashFiles('third_party/gltf-corpus.manifest') }}

      - name: Fetch the glTF conformance corpus
        shell: bash
        run: tools/fetch-gltf-corpus.sh

      - name: Bootstrap the Blix tools
        run: ./blix ls

      - name: Restore
        run: dotnet restore Blix.sln

      - name: Build
        run: dotnet build Blix.sln --no-restore --disable-build-servers -p:UseSharedCompilation=false -m:1

      - name: Run the root gate
        run: ./blix test

  windows:
    name: Build and root gate (Windows)
    runs-on: windows-latest
    timeout-minutes: 45

    # Every one of the eight suites is deviceless -- not one of them creates a
    # VulkanGraphicsDevice or a Window (checked, not assumed). So this runs the WHOLE
    # gate, not a chosen subset, on a runner with no GPU. What it cannot see is
    # pipeline-time breakage, which needs a booted application and stays a pre-commit
    # concern on purpose.
    #
    # This is the feedback loop the Windows audit did not originally have: `blix.cmd`
    # and the native build's Windows branch are ordinary exercised code rather than
    # paths inferred from reading.
    steps:
      - name: Check out Blix
        uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      # glslc and spirv-cross are build-time prerequisites with teeth: shaders compile
      # and reflect during the build, so neither is optional. The SDK also installs the
      # loader into System32, which is what blix.cmd checks for before doing anything.
      - name: Install the Vulkan SDK (glslc, spirv-cross, the loader)
        run: |
          $ErrorActionPreference = 'Stop'
          # Pinned, and pins rot: LunarG stops serving older installers without notice. 1.3.290.0
          # began returning 404 on 2026-09-29 (as did 1.4.313.0 and 1.4.321.1), which failed this
          # job before it built anything. When it happens again, find a live one with
          #   curl -sI https://sdk.lunarg.com/sdk/download/<v>/windows/VulkanSDK-<v>-Installer.exe
          # From 1.4.3xx some releases are named vulkansdk-windows-X64-<v>.exe instead.
          $version = '1.4.309.0'
          $url = "https://sdk.lunarg.com/sdk/download/$version/windows/VulkanSDK-$version-Installer.exe"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\vulkan-sdk.exe"
          & "$env:RUNNER_TEMP\vulkan-sdk.exe" --root C:\VulkanSDK --accept-licenses `
              --default-answer --confirm-command install | Out-Null
          "C:\VulkanSDK\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Show what the prerequisites resolved to
        run: |
          glslc --version
          spirv-cross --version
          clang++ --version

      # The glTF conformance corpus is a pinned manifest rather than committed bytes
      # (conventions §7, and three upstream licences). Nothing fetched it in CI, so the
      # eight conformance checks in Blix.Test.Recipes announced themselves as skipped on
      # every run and only ever ran where somebody had fetched by hand -- an instrument
      # that exists and is not used, which is how Blix.Test.Studio once went red unnoticed.
      # Cached on the manifest's hash, so it is one download per change to the manifest.
      - name: Cache the glTF conformance corpus
        uses: actions/cache@v4
        with:
          path: third_party/gltf-corpus
          key: gltf-corpus-${{ hashFiles('third_party/gltf-corpus.manifest') }}

      - name: Fetch the glTF conformance corpus
        shell: bash
        run: tools/fetch-gltf-corpus.sh

      - name: Bootstrap the Blix tools
        run: .\blix.cmd ls

      - name: Restore
        run: dotnet restore Blix.sln

      - name: Build
        run: dotnet build Blix.sln --no-restore --disable-build-servers -p:UseSharedCompilation=false -m:1

      - name: Run the root gate
        run: .\blix.cmd test
