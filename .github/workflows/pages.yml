name: Website

# The site is static - no build, no dependencies - so this uploads website/ as it
# stands. Publishing needs Pages set to "GitHub Actions" once, in repository
# settings; until then this job builds the artifact and the deploy step fails.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race, and never cancel one half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out Blix
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
