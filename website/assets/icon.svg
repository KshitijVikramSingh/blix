<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5.31 -13.31 72.62 72.62">
  <title>Blix</title>
  <style>
    /* The mark needs a different ramp per ground: it is built so the lit face is
       brightest, which is right on a dark surface and backwards on a light one.
       A tab strip can be either, so the favicon asks. */
    :root { --top: #ba3412; --shadow: #83230b; --lit: #e3441c; }
    @media (prefers-color-scheme: dark) {
      :root { --top: #e84117; --shadow: #a72f11; --lit: #ee6f4f; }
    }
    .brackets { stroke: var(--top); }
    .top { fill: var(--top); }
    .shadow { fill: var(--shadow); }
    .lit { fill: var(--lit); }
  </style>
  <path class="brackets" d="M17 4 H4 V42 H17 M45 4 H58 V42 H45" stroke-width="7"
        fill="none" stroke-linecap="butt" stroke-linejoin="miter"/>
  <polygon class="top" points="31,10 44,16.5 31,23 18,16.5"/>
  <polygon class="shadow" points="18,16.5 31,23 31,36 18,29.5"/>
  <polygon class="lit" points="44,16.5 31,23 31,36 44,29.5"/>
</svg>
