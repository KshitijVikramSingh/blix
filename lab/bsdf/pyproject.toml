[project]
name = "bsdflab"
version = "0.0.1"
description = "Blix BSDF lab: reference implementations and property tests for the diffuse and specular models. Offline; the engine holds its own copies, answerable to these."
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=8",
]

[tool.uv]
package = false  # a lab, not a distribution: run from this directory

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
